name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Backend — Spring Boot + Maven
  # Ejecuta las pruebas unitarias e integración
  # contra H2 en memoria; no toca Supabase.
  # ─────────────────────────────────────────────
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: proyectos/backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas
        run: ./mvnw test --no-transfer-progress

  # ─────────────────────────────────────────────
  # JOB 2: Frontend — Next.js + Node 22
  # Instala dependencias, valida linting y
  # compila la aplicación.
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (Node 22 / Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: proyectos/frontend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: proyectos/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
