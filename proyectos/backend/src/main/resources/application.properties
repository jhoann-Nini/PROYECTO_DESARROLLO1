spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}?sslmode=require
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.orm.connections.pooling=WARN

# Supabase JWT (ES256)
supabase.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:https://xjepyqdynspdekuixuoe.supabase.co/auth/v1}
supabase.jwt.jwk-set-uri=${SUPABASE_JWKS_URI:https://xjepyqdynspdekuixuoe.supabase.co/auth/v1/.well-known/jwks.json}
supabase.jwt.audience=${SUPABASE_JWT_AUDIENCE:authenticated}
