spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Supabase JWT (ES256)
supabase.jwt.issuer-uri=https://xjepyqdynspdekuixuoe.supabase.co/auth/v1
supabase.jwt.jwk-set-uri=https://xjepyqdynspdekuixuoe.supabase.co/auth/v1/.well-known/jwks.json
supabase.jwt.audience=authenticated

# Control general de tasa de peticiones (HU-S2-14 / TEC-121)
ratelimit.general.enabled=true
ratelimit.general.limit=100
ratelimit.general.window-seconds=60
